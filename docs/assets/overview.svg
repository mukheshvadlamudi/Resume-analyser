<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Resume Analyzer workflow overview</title><desc id="desc">Conceptual workflow artwork, not an application screenshot. Streamlit + OpenRouter  ·  Resume text leaves your device  ·  Scores are model opinions</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#80909b"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="560" rx="0" fill="#f6f7f5" stroke="#f6f7f5"/><rect x="56" y="48" width="46" height="46" rx="12" fill="#17212b" stroke="#17212b"/><text x="79" y="79" fill="#ffffff" font-size="27" font-weight="600" text-anchor="middle">R</text><text x="118" y="80" fill="#17212b" font-size="27" font-weight="650" text-anchor="start">Resume Analyzer</text><text x="56" y="167" fill="#17212b" font-size="45" font-weight="650" text-anchor="start">A clearer view of your resume.</text><text x="56" y="211" fill="#61707c" font-size="23" font-weight="400" text-anchor="start">Role-aware feedback from a PDF, with strengths and next steps.</text><rect x="56" y="270" width="372" height="198" rx="10" fill="#ffffff" stroke="#dce2e6"/><path d="M80 307 h28" stroke="#bd6049" stroke-width="4"/><text x="80" y="341" fill="#61707c" font-size="18" font-weight="600" text-anchor="start">01 / DOCUMENT</text><text x="80" y="383" fill="#17212b" font-size="26" font-weight="600" text-anchor="start">Bring a resume</text><text x="80" y="418" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Upload a text-based PDF</text><text x="80" y="445" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Choose a role or fresher mode</text><path d="M432 369 H450" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="454" y="270" width="372" height="198" rx="10" fill="#ffffff" stroke="#dce2e6"/><path d="M478 307 h28" stroke="#bd6049" stroke-width="4"/><text x="478" y="341" fill="#61707c" font-size="18" font-weight="600" text-anchor="start">02 / MODEL</text><text x="478" y="383" fill="#17212b" font-size="26" font-weight="600" text-anchor="start">Request a review</text><text x="478" y="418" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Extract text with PyPDF2</text><text x="478" y="445" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Send context to OpenRouter</text><path d="M830 369 H848" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="852" y="270" width="372" height="198" rx="10" fill="#ffffff" stroke="#dce2e6"/><path d="M876 307 h28" stroke="#bd6049" stroke-width="4"/><text x="876" y="341" fill="#61707c" font-size="18" font-weight="600" text-anchor="start">03 / FEEDBACK</text><text x="876" y="383" fill="#17212b" font-size="26" font-weight="600" text-anchor="start">Find the next edit</text><text x="876" y="418" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Strengths and suggestions</text><text x="876" y="445" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">A score to interpret critically</text><text x="56" y="520" fill="#61707c" font-size="19" font-weight="400" text-anchor="start">Streamlit + OpenRouter  ·  Resume text leaves your device  ·  Scores are model opinions</text></g></svg>